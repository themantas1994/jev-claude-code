name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "themantas1994"
          git config user.email "paulomantas2009@gmail.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/weiping/jev-claude-code.git
          git fetch upstream main

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Merge of upstream/main conflicts with this fork; a manual merge is needed."
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
